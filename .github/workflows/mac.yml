name: Build macOS app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: mac
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Sujood-mac
          path: mac/Sujood-mac.zip
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" mac/Sujood-mac.zip --clobber
